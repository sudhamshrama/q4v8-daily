   'Pull the handle to your <b>belly button</b>, not your chest.',
   'Let the weight pull your arms forward and your shoulder blades apart at the front — that stretch counts.'],
 miss:['Leaning way back at the end like a rowing machine. Your torso should barely move.',
   'Shrugging the traps up instead of pulling the blades back and down.',
   'Jerking the start of the pull with your lower back.'],
 why:'Pulldowns build width, rows build thickness and fix the forward-shoulder posture that comes with desk work. You need both, so they sit back-to-back on your pull day.'},

assistedpullup:{n:'Assisted Pull-Up',m:'Lats · Upper Back · Biceps',lv:2,hi:['arm','fore'],
 g:{post:[104,216],floor:0,grip:1,grip2:1},
 A:{h:[160,140],t:92,n:92,a:84,f:86,th:250,s:236,ft:10,a2:96,f2:94,th2:246,s2:232},
 B:{h:[160,102],t:92,n:88,a:104,f:210,th:250,s:236,ft:10,a2:116,f2:216,th2:246,s2:232},
 tips:['Set the assist so you can just barely finish <b>6–8 reps</b>. Too much help and it stops being a pull-up.',
   'Start from a <b>dead hang</b> with straight arms every rep. No half reps at the bottom.',
   'Drive your elbows down toward your back pockets and think about touching your chest to the bar.',
   'Lower under control for 2–3 seconds. Do not just drop.'],
 miss:['Kipping or swinging the legs to generate momentum.',
   'Stopping halfway down each rep to make it feel easier.',
   'Chin craning up over the bar while the chest never rises.'],
 why:'Nothing builds the lats and the whole upper back like a vertical pull with your own bodyweight. The assist machine is the honest way to get there. Cut the assistance by 5 lb whenever 8 reps feels comfortable.'},

dbrow:{n:'Single-Arm Dumbbell Row',m:'Lats · Mid Back',lv:2,hi:['arm','fore'],
 g:{bench:[104,152,0,104],db:1,dbAng:90},
 A:{h:[196,128],t:172,n:158,a:272,f:272,th:262,s:272,ft:0,th2:250,s2:266,a2:186,f2:186},
 B:{h:[196,128],t:172,n:158,a:326,f:250,th:262,s:272,ft:0,th2:250,s2:266,a2:186,f2:186},
 tips:['Brace one hand and one knee on the bench. Your <b>back stays flat</b> — imagine a plate balanced on it.',
   'Let the dumbbell hang and stretch your lat at the bottom, then pull the elbow to your <b>hip</b>, not your armpit.',
   'Keep your shoulders square to the floor — no twisting to lift the weight higher.',
   'Pause for a second at the top with your shoulder blade pulled back.'],
 miss:['Rotating the torso open to swing the weight up.',
   'Rounding the lower back at the bottom of the stretch.',
   'Rowing with a jerk from the hips instead of the back.'],
 why:'Working one side at a time exposes and evens out the strength difference between your left and right. That matters to you specifically since you described the body as looking disproportional.'},

straightarm:{n:'Straight-Arm Cable Pulldown',m:'Lats (isolation)',lv:2,hi:['arm','fore'],
 g:{post:[250],pulley:[236,42],stack:[250,92],cable:[236,42],cable2:1},
 A:{h:[152,126],t:80,n:80,a:52,f:48,th:266,s:276,ft:0,a2:56,f2:52,th2:262,s2:280},
 B:{h:[152,126],t:76,n:78,a:-42,f:-46,th:266,s:276,ft:0,a2:-38,f2:-42,th2:262,s2:280},
 tips:['Arms stay <b>almost straight</b> the whole rep — small fixed elbow bend, never changing.',
   'Hinge forward slightly at the hips and keep the chest proud.',
   'Sweep the bar down to your thighs in a wide arc and squeeze the lats hard at the bottom.',
   'This is a light exercise. If you need to bend your arms, drop the weight.'],
 miss:['Turning it into a triceps pushdown by bending and extending the elbows.',
   'Standing too close to the tower so the arc is cut short.',
   'Using your bodyweight to press the bar down.'],
 why:'This teaches you to feel your lats working without the biceps taking over. Once you can feel them here, your pulldowns and rows get noticeably better.'},

facepull:{n:'Cable Face Pull',m:'Rear Delt · Rotator Cuff · Traps',lv:2,hi:['arm','fore'],
 g:{post:[254],pulley:[240,74],stack:[254,96],cable:[240,74],cable2:1},
 A:{h:[150,126],t:88,n:90,a:14,f:8,th:268,s:274,ft:0,a2:10,f2:4,th2:264,s2:278},
 B:{h:[150,126],t:88,n:90,a:150,f:66,th:268,s:274,ft:0,a2:154,f2:70,th2:264,s2:278},
 tips:['Set the pulley at about <b>eye height</b> and use the rope.',
   'Pull the rope toward your <b>forehead</b>, splitting your hands apart as you go.',
   'Finish with your knuckles beside your ears and your elbows high — like a double bicep pose.',
   'Light weight, high reps. This is a health exercise, not an ego one.'],
 miss:['Pulling it down to the chest like a row — that misses the rear delt entirely.',
   'Loading it so heavy the whole body leans back.',
   'Letting the elbows drop below the wrists.'],
 why:'Every pressing exercise pulls your shoulders forward. This pulls them back. Two sets a week is the cheapest shoulder insurance you can buy, and it makes your posture look better in a t-shirt immediately.'},

backext:{n:'Back Extension Machine',m:'Lower Back · Glutes',lv:1,hi:['torso'],
 g:{seat:[150,164,0],stack:[250,92],post:[248],arm:[236,120],pad:'sho'},
 A:{h:[150,162],t:118,n:118,a:238,f:230,th:-8,s:264,ft:0,a2:242,f2:234,th2:-16,s2:260},
 B:{h:[150,162],t:82,n:82,a:250,f:242,th:-8,s:264,ft:0,a2:254,f2:246,th2:-16,s2:260},
 tips:['Set the pad across your <b>upper back / shoulder blades</b>, not your neck.',
   'Push back by driving through the mid-back, then return under control.',
   'Stop when your torso is roughly in line with your hips — do not hyperextend backwards.',
   'Slow and steady. This is not a movement to swing.'],
 miss:['Slamming back into the pad and bouncing off the stops.',
   'Loading it so heavy that your lower back arches sharply at the end.',
   'Holding your breath through the set.'],
 why:'A strong lower back is what lets you hold a neutral spine on rows, RDLs and lunges. It is also the muscle that stops office chairs from wrecking your posture.'},

/* ─── SHOULDERS ──────────────────────────────────────────────── */
shoulderpress:{n:'Seated Shoulder Press Machine',m:'Front & Side Delt · Triceps',lv:1,hi:['arm','fore'],
 g:{seat:[150,162,88],stack:[248,92],post:[246],grip:1,grip2:1},
 A:{h:[150,160],t:92,n:92,a:8,f:96,th:-8,s:264,ft:0,a2:4,f2:100,th2:-16,s2:260},
 B:{h:[150,160],t:92,n:92,a:76,f:86,th:-8,s:264,ft:0,a2:72,f2:82,th2:-16,s2:260},
 tips:['Adjust the seat so the handles start at about <b>chin to ear height</b>.',
   'Keep your back flat against the pad and your ribs down — do not arch to press.',
   'Press up until your elbows are nearly straight, then lower slowly to the start.',
   'Neutral or slightly angled grip is friendlier on the shoulder than a wide flared one.'],
 miss:['Arching the lower back off the pad, which turns it into an incline press.',
   'Going only halfway down and missing the range where the delt actually works.',
   'Shrugging the shoulders up at the top of every rep.'],
 why:'Delts are the highest-leverage muscle on your body for the look you described. Broad shoulders make a 32-inch waist read as narrow. This is your heavy shoulder press.'},

dbshoulder:{n:'Seated Dumbbell Shoulder Press',m:'Front & Side Delt · Triceps',lv:2,hi:['arm','fore'],
 g:{bench:[150,140,78,110],db:1,db2:1,dbAng:0},
 A:{h:[158,148],t:96,n:96,a:16,f:100,th:-10,s:262,ft:0,a2:12,f2:104,th2:-18,s2:258},
 B:{h:[158,148],t:96,n:96,a:80,f:88,th:-10,s:262,ft:0,a2:76,f2:84,th2:-18,s2:258},
 tips:['Set the bench upright or one notch back from vertical (<b>85–90°</b>) — the angle you already checked.',
   'Start with the dumbbells at ear height, elbows just in front of your body, not flared straight out.',
   'Press up and slightly in; do not clank the bells together.',
   'Lower until your upper arms are just below parallel to the floor.'],
 miss:['Letting the elbows drift way behind the body at the bottom.',
   'Bouncing the dumbbells off your shoulders.',
   'Arching the lower back to grind out an extra rep — end the set instead.'],
 why:'Dumbbells make each shoulder work independently and let the shoulder blade move naturally, which the machine will not. Alternate the emphasis: machine when heavy, dumbbells when you want control.'},

lateralraise:{n:'Dumbbell Lateral Raise',m:'Side Delt',lv:1,hi:['arm','fore'],
 g:{db:1,db2:1,dbAng:0},
 A:{h:[160,124],t:90,n:90,a:274,f:272,th:268,s:272,ft:0,a2:266,f2:268,th2:272,s2:268},
 B:{h:[160,124],t:88,n:90,a:352,f:350,th:268,s:272,ft:0,a2:188,f2:190,th2:272,s2:268},
 tips:['Lead with your <b>elbows</b>, not your hands. Imagine pouring water from a jug at the top.',
   'Raise to <b>shoulder height and no higher</b> — above that the traps take over.',
   'Small forward lean, tiny bend in the elbow, and keep it fixed.',
   'Lower for a full 3 seconds. The lowering is where the side delt earns its keep.'],
 miss:['Swinging the weights up with a hip thrust. If you need momentum, go lighter.',
   'Shrugging — if you feel it in your neck, the weight is too heavy.',
   'Going above shoulder height and turning it into a front raise.'],
 why:'This is the exercise most responsible for the V-shape. Side delts are small, so they grow on volume, not load. You will use 10–15 lb here and that is completely fine — the goal is a burning delt, not a heavy dumbbell.'},

cablelateral:{n:'Cable Lateral Raise',m:'Side Delt',lv:2,hi:['arm','fore'],
 g:{post:[262],pulley:[252,190],stack:[262,96],cable:[252,190]},
 A:{h:[152,124],t:90,n:90,a:276,f:274,th:268,s:272,ft:0,a2:264,f2:262,th2:272,s2:268},
 B:{h:[152,124],t:88,n:90,a:354,f:352,th:268,s:272,ft:0,a2:264,f2:262,th2:272,s2:268},
 tips:['Stand side-on with the cable running <b>behind your body</b>, low pulley, single handle.',
   'Cross the arm slightly in front of your body at the bottom for a bigger range.',
   'Same rules as the dumbbell version: lead with the elbow, stop at shoulder height.',
   'Do all reps on one arm, then switch. Hold the frame with your free hand for balance.'],
 miss:['Standing too close to the tower so there is no tension at the bottom.',
   'Leaning away from the stack to cheat the weight up.',
   'Letting the arm drift forward into a front raise.'],
 why:'A cable holds tension at the bottom of the rep where a dumbbell has none. Pairing both in one week hits the side delt from two different resistance curves.'},

reardelt:{n:'Reverse Pec Deck',m:'Rear Delt · Upper Back',lv:1,hi:['arm','fore'],
 g:{seat:[152,162,-70],stack:[70,92],post:[68],arm:[68,110],grip:1,grip2:1},
 A:{h:[152,160],t:82,n:76,a:8,f:2,th:-10,s:262,ft:0,a2:12,f2:6,th2:-18,s2:258},
 B:{h:[152,160],t:82,n:76,a:150,f:144,th:-10,s:262,ft:0,a2:154,f2:148,th2:-18,s2:258},
 tips:['Sit facing the pad, chest against it, and set the handles at <b>shoulder height</b>.',
   'Think about pulling your <b>elbows</b> apart and back, not your hands.',
   'Keep the elbows almost straight with one fixed soft bend.',
   'Squeeze the shoulder blades together for a full second at the back.'],
 miss:['Bending the arms and turning it into a row.',
   'Using so much weight that the chest peels off the pad.',
   'Rushing the return and losing the stretch.'],
 why:'Rear delts finish the round, three-dimensional shoulder. They are also the muscle nobody trains, which is why most people look narrow from the side. You hit them twice a week.'},

frontraise:{n:'Dumbbell Front Raise',m:'Front Delt',lv:1,hi:['arm','fore'],
 g:{db:1,db2:1,dbAng:0},
 A:{h:[160,124],t:90,n:90,a:272,f:270,th:268,s:272,ft:0,a2:268,f2:266,th2:272,s2:268},
 B:{h:[160,124],t:90,n:90,a:2,f:0,th:268,s:272,ft:0,a2:268,f2:266,th2:272,s2:268},
 tips:['Raise to <b>shoulder height only</b>, thumb slightly higher than the little finger.',
   'Keep your ribs down and squeeze your glutes so you cannot lean back.',
   'Alternate arms so you can keep the torso perfectly still.',
   'Light weight. Front delts already get a lot of work from every press you do.'],
 miss:['Leaning back and using the lower back as a lever.',
   'Swinging the dumbbells up above the head.',
   'Doing four sets of it — the front delt does not need that much direct work.'],
 why:'Two sets, not more. Your front delts already work on every chest and shoulder press, so this is a finisher, not a main course.'},

shrug:{n:'Dumbbell Shrug',m:'Upper Traps',lv:1,hi:['torso'],
 g:{db:1,db2:1,dbAng:0},
 A:{h:[160,126],t:90,n:90,a:272,f:271,th:268,s:272,ft:0,a2:268,f2:269,th2:272,s2:268},
 B:{h:[160,120],t:90,n:90,a:272,f:271,th:268,s:272,ft:0,a2:268,f2:269,th2:272,s2:268},
 tips:['Straight up and straight down. <b>No rolling</b> the shoulders — that does nothing extra and irritates the joint.',
   'Pause and squeeze for a full second at the top.',
   'Let the weights pull your shoulders all the way down at the bottom for a stretch.',
   'Keep your chin tucked and your neck relaxed.'],
 miss:['Rolling the shoulders in circles.',
   'Bouncing at the bottom with a quarter-inch range of motion.',
   'Using straps and grabbing the heaviest bells in the rack on week one.'],
 why:'Kept deliberately light and last. Overdeveloped upper traps actually make shoulders look narrower — the opposite of your goal. Two sets is enough for thickness without stealing your V-taper.'}

};
</script>
<script>
Object.assign(EX,{

/* ─── ARMS ───────────────────────────────────────────────────── */
dbcurl:{n:'Dumbbell Biceps Curl',m:'Biceps',lv:1,hi:['fore'],
 g:{db:1,db2:1,dbAng:0},
 A:{h:[160,124],t:90,n:90,a:272,f:270,th:268,s:272,ft:0,a2:268,f2:266,th2:272,s2:268},
 B:{h:[160,124],t:90,n:90,a:280,f:66,th:268,s:272,ft:0,a2:268,f2:266,th2:272,s2:268},
 tips:['Pin your <b>elbows to your sides</b> and keep them there. If the elbow travels forward, the front delt is doing the work.',
   'Turn your palm up and squeeze at the top — the biceps also rotates the forearm, so use that.',
   'Lower all the way to a straight arm every rep.',
   'Alternate arms or do both together, but keep the torso completely still.'],
 miss:['Swinging the weight with the lower back.',
   'Stopping halfway down and never straightening the arm.',
   'Elbows drifting forward so it becomes a front raise with a bent arm.'],
 why:'Arms grow from your rows and pulldowns more than you would think, so curls are a finisher here. Three sets at the end of pull day is the right dose.'},

hammer:{n:'Hammer Curl',m:'Biceps · Brachialis · Forearm',lv:1,hi:['fore'],
 g:{db:1,db2:1,dbAng:90},
 A:{h:[160,124],t:90,n:90,a:272,f:270,th:268,s:272,ft:0,a2:268,f2:266,th2:272,s2:268},
 B:{h:[160,124],t:90,n:90,a:280,f:62,th:268,s:272,ft:0,a2:268,f2:266,th2:272,s2:268},
 tips:['Palms face <b>each other</b> the whole rep, like holding two hammers.',
   'Same rules as a normal curl: elbows pinned, no swinging, full extension at the bottom.',
   'You will usually be able to use slightly more weight than on a supinated curl.',
   'Squeeze for a beat at the top.'],
 miss:['Rotating the palms up during the rep.',
   'Letting the shoulders round forward as you curl.',
   'Rushing so the forearms never really load.'],
 why:'The brachialis sits underneath the biceps and pushes it up, which adds visible arm thickness from the side. It also builds the grip you will need on rows and pulldowns.'},

pushdown:{n:'Triceps Rope Pushdown',m:'Triceps',lv:1,hi:['fore'],
 g:{post:[250],pulley:[238,44],stack:[250,92],cable:[238,44],rope:1},
 A:{h:[158,126],t:88,n:88,a:296,f:26,th:268,s:272,ft:0,a2:292,f2:22,th2:272,s2:268},
 B:{h:[158,126],t:88,n:88,a:296,f:288,th:268,s:272,ft:0,a2:292,f2:284,th2:272,s2:268},
 tips:['Elbows <b>glued to your ribs</b>. Only the forearm moves.',
   'At the bottom, spread the rope apart and turn the knuckles slightly outward for a harder squeeze.',
   'Lean forward a few degrees and keep a soft knee.',
   'Control the way back up until you feel the stretch, then push again.'],
 miss:['Elbows flaring out and travelling forward, turning it into a chest press.',
   'Leaning the whole bodyweight onto the rope.',
   'Only doing the bottom third of the movement.'],
 why:'Triceps are two thirds of your arm. This is the safest way to load them hard when your shoulders are already tired from pressing.'},

overheadtri:{n:'Overhead Dumbbell Triceps Extension',m:'Triceps (long head)',lv:2,hi:['fore'],
 g:{bench:[150,142,80,104],db:1,dbAng:0},
 A:{h:[158,150],t:94,n:94,a:88,f:84,th:-10,s:262,ft:0,a2:86,f2:82,th2:-18,s2:258},
 B:{h:[158,150],t:94,n:94,a:88,f:206,th:-10,s:262,ft:0,a2:86,f2:204,th2:-18,s2:258},
 tips:['Hold one dumbbell with <b>both hands</b>, cupping the top plate.',
   'Keep the upper arms vertical and beside your ears — only the forearms move.',
   'Lower behind the head until you feel a strong stretch in the back of the arm.',
   'Sit on an upright bench so your lower back is supported.'],
 miss:['Letting the elbows flare wide, which lets the shoulders take over.',
   'Bouncing out of the bottom stretch.',
   'Going too heavy — this position is vulnerable, control beats load.'],
 why:'The long head of the triceps only gets a full stretch when the arm is overhead. Pushdowns never reach it. This is the exercise that adds thickness to the back of the arm.'},

cableoverhead:{n:'Cable Overhead Triceps Extension',m:'Triceps (long head)',lv:2,hi:['fore'],
 g:{post:[52],pulley:[62,44],stack:[52,92],cable:[62,44],rope:0},
 A:{h:[166,126],t:76,n:80,a:118,f:110,th:264,s:276,ft:0,a2:122,f2:114,th2:260,s2:280},
 B:{h:[166,126],t:76,n:80,a:118,f:8,th:264,s:276,ft:0,a2:122,f2:12,th2:260,s2:280},
 tips:['Face <b>away</b> from the tower with the rope over your shoulders, staggered stance.',
   'Upper arms stay pointing forward and still — hinge only at the elbow.',
   'Drive the rope forward and apart, finishing with straight arms.',
   'Let the cable pull your hands back behind your head for the stretch.'],
 miss:['Standing too upright so the cable pulls you off balance.',
   'Dropping the elbows down as you extend.',
   'Using the whole torso to push the weight.'],
 why:'Constant tension in the stretched position — the best of both the pushdown and the overhead extension in one movement.'},

/* ─── LEGS ───────────────────────────────────────────────────── */
legpress:{n:'Leg Press',m:'Quads · Glutes · Hamstrings',lv:1,hi:['thigh','shin'],
 g:{seat:[112,158,66],sled:[228,110,52],post:[262],stack:[262,96]},
 A:{h:[126,152],t:130,n:130,a:238,f:232,th:34,s:112,ft:44,th2:26,s2:104,a2:242,f2:236},
 B:{h:[126,152],t:130,n:130,a:238,f:232,th:16,s:14,ft:14,th2:10,s2:8,a2:242,f2:236},
 tips:['Feet <b>shoulder width</b>, mid-foot on the platform, toes very slightly out.',
   'Lower until your knees reach about <b>90°</b> — deeper only if your lower back stays flat on the pad.',
   'Push through the whole foot, mostly the heel. Never let the heels lift.',
   'Stop just short of locking the knees at the top and go straight into the next rep.'],
 miss:['Letting the lower back round and lift off the pad at the bottom. This is how people hurt themselves on this machine.',
   'Slamming into full lockout and hyperextending the knees.',
   'Placing the hands on the knees to push.'],
 why:'You have no squat rack, so the leg press is your heavy leg movement. It loads the quads and glutes hard with your spine fully supported, which is ideal while your core is still catching up.'},

smithsquat:{n:'Smith Machine Squat',m:'Quads · Glutes',lv:2,hi:['thigh','shin'],
 g:{rails:[128,196],bar:1,db2:1},
 A:{h:[160,120],t:88,n:88,a:344,f:24,th:268,s:274,ft:0,a2:196,f2:156,th2:272,s2:270},
 B:{h:[160,160],t:72,n:78,a:344,f:24,th:212,s:302,ft:0,a2:196,f2:156,th2:216,s2:298},
 tips:['Set your feet <b>slightly in front</b> of the bar so your shins stay near vertical as you descend.',
   'Bar sits on the meaty part of your upper traps, not on the bony bit of your neck.',
   'Sit down and back until your thighs reach parallel. Chest stays up.',
   'Drive through the whole foot and squeeze the glutes at the top.'],
 miss:['Feet set directly under the bar, which forces the knees far forward and the back to round.',
   'Knees caving inward — push them out over the middle of your feet.',
   'Coming up onto the toes at the bottom.'],
 why:'The fixed bar path means you can learn the squat pattern without a spotter and without balance being the limiting factor. Once your technique is solid this becomes your second heaviest leg movement.'},

legext:{n:'Leg Extension',m:'Quads',lv:1,hi:['shin'],
 g:{seat:[142,158,84],stack:[248,92],post:[246],pad:'ank'},
 A:{h:[142,156],t:92,n:92,a:250,f:246,th:-6,s:266,ft:6,th2:-14,s2:262,a2:254,f2:250},
 B:{h:[142,156],t:92,n:92,a:250,f:246,th:-6,s:-4,ft:-2,th2:-14,s2:-12,a2:254,f2:250},
 tips:['Line the machine\'s pivot up with your <b>knee joint</b>, and set the pad just above your ankle.',
   'Extend all the way and hold the squeeze for a full second at the top.',
   'Lower slowly — 3 seconds — and stop just before the stack touches down.',
   'Grip the handles and keep your hips pressed into the seat.'],
 miss:['Jerking the weight up with a hip thrust.',
   'Bouncing out of the bottom.',
   'Loading so heavy you can only do partial reps at the top.'],
 why:'The only movement in the gym that isolates the quads with zero help from the hips. Great for adding shape to the front of the thigh, which is exactly the change that makes legs look leaner as fat comes off.'},

legcurl:{n:'Seated Leg Curl',m:'Hamstrings',lv:1,hi:['shin'],
 g:{seat:[142,158,84],stack:[248,92],post:[246],pad:'ank'},
 A:{h:[142,156],t:92,n:92,a:250,f:246,th:-6,s:-4,ft:-2,th2:-14,s2:-12,a2:254,f2:250},
 B:{h:[142,156],t:92,n:92,a:250,f:246,th:-6,s:274,ft:16,th2:-14,s2:270,a2:254,f2:250},
 tips:['Set the thigh pad down snug so your hips cannot lift as you curl.',
   'Curl as far as the machine allows and <b>squeeze</b> hard at the end.',
   'Point your toes toward your shins — it makes the hamstring work harder.',
   'Return slowly. The lowering builds more hamstring than the curl does.'],
 miss:['Hips rising off the seat to help the weight down.',
   'Half reps in the easy middle range.',
   'Rushing so the return is basically a free fall.'],
 why:'Hamstrings balance out the quads, protect the knee, and fill out the back of the leg. Most beginners train quads three times as much as hamstrings — you will not.'},

rdl:{n:'Dumbbell Romanian Deadlift',m:'Hamstrings · Glutes · Lower Back',lv:2,hi:['thigh','torso'],
 g:{db:1,db2:1,dbAng:0},
 A:{h:[160,124],t:90,n:90,a:272,f:271,th:268,s:272,ft:0,a2:268,f2:269,th2:272,s2:268},
 B:{h:[152,128],t:34,n:40,a:272,f:271,th:262,s:272,ft:0,a2:268,f2:269,th2:266,s2:268},
 tips:['This is a <b>hinge, not a squat</b>. Push your hips backwards toward the wall behind you and let the knees bend only slightly.',
   'Keep the dumbbells dragging close to your thighs the whole way down.',
   'Go down only as far as you can while keeping your <b>back flat</b> — for most people that is mid-shin.',
   'Drive your hips forward to stand up and squeeze your glutes at the top.'],
 miss:['Rounding the lower back to reach further down. Range of motion is never worth a rounded spine.',
   'Turning it into a squat by bending the knees a lot.',
   'Letting the dumbbells drift away from the legs, which multiplies the load on your lower back.'],
 why:'The single best movement for the back of your legs and glutes with the equipment you have. Start light and earn the weight — technique on this one matters more than on anything else in your program.'},

lunge:{n:'Dumbbell Walking Lunge',m:'Quads · Glutes · Balance',lv:2,hi:['thigh','shin'],
 g:{db:1,db2:1,dbAng:0},
 A:{h:[160,124],t:88,n:88,a:272,f:271,th:268,s:272,ft:0,a2:268,f2:269,th2:272,s2:268},
 B:{h:[160,150],t:86,n:88,a:272,f:271,th:308,s:264,ft:0,a2:268,f2:269,th2:230,s2:318,ft2:40},
 tips:['Step forward far enough that your <b>front shin stays vertical</b> when you drop.',
   'Lower straight down until the back knee is just above the floor.',
   'Push through the <b>front heel</b> to come up and step straight into the next rep.',
   'Torso upright, chest proud, eyes forward on a fixed point.'],
 miss:['Short steps that push the front knee way past the toes.',
   'Letting the front knee collapse inward.',
   'Leaning the torso forward over the front leg.'],
 why:'Single-leg work exposes side-to-side imbalances and hits the glutes harder than any two-legged movement. It also burns a surprising amount while you are in a deficit.'},

goblet:{n:'Goblet Squat',m:'Quads · Glutes · Core',lv:1,hi:['thigh','shin'],
 g:{db:1,dbAng:90},
 A:{h:[160,120],t:90,n:90,a:318,f:36,th:268,s:272,ft:0,a2:222,f2:144,th2:272,s2:268},
 B:{h:[160,162],t:70,n:78,a:318,f:36,th:210,s:304,ft:0,a2:222,f2:144,th2:214,s2:300},
 tips:['Hold one dumbbell vertically against your chest, elbows tucked in.',
   'Feet shoulder width, toes turned out about 15–20°.',
   'Sit <b>between</b> your heels rather than back — the weight in front lets you stay upright.',
   'Push the knees out and drive up through mid-foot.'],
 miss:['Letting the dumbbell drift away from the chest.',
   'Heels lifting at the bottom — if that happens, widen your stance or go shallower.',
   'Rounding the upper back under the weight.'],
 why:'The counterweight at your chest makes it almost impossible to squat with bad posture, so this is the fastest way to learn the pattern. Also a brutal finisher at higher reps.'},

hipthrust:{n:'Smith Machine Hip Thrust',m:'Glutes · Hamstrings',lv:2,hi:['thigh','torso'],
 g:{rails:[136,190],bench:[92,148,0,72],bar:1,db2:1},
 A:{h:[164,164],t:34,n:26,a:250,f:246,th:172,s:246,ft:-10,th2:166,s2:242,a2:254,f2:250},
 B:{h:[164,140],t:2,n:0,a:250,f:246,th:196,s:266,ft:-10,th2:190,s2:262,a2:254,f2:250},
 tips:['Upper back on the bench at about the line of your <b>shoulder blades</b>, feet flat and shins vertical at the top.',
   'Use a pad on the bar. Your hip bones will thank you.',
   'Drive through your <b>heels</b> and squeeze the glutes hard for a full second at the top.',
   'Finish with your torso parallel to the floor — chin tucked, ribs down, do not arch the lower back.'],
 miss:['Hyperextending the lower back at the top instead of squeezing the glutes.',
   'Feet too far away, which turns it into a hamstring exercise.',
   'Pushing the chin up toward the ceiling.'],
 why:'The most direct glute loading available to you. Strong glutes change the shape of your whole lower body and take pressure off your lower back on every other lift.'},

abduction:{n:'Hip Abduction Machine',m:'Glute Medius · Outer Hip',lv:1,hi:['thigh'],
 g:{seat:[150,158,80],stack:[248,92],post:[246]},
 A:{h:[150,156],t:88,n:88,a:250,f:246,th:-8,s:266,ft:0,th2:-8,s2:266,a2:254,f2:250},
 B:{h:[150,156],t:88,n:88,a:250,f:246,th:4,s:278,ft:12,th2:-22,s2:252,a2:254,f2:250},
 tips:['Sit tall with your back flat against the pad.',
   'Push the pads apart with your <b>outer hips</b>, not by leaning back.',
   'Pause for a second at the widest point and squeeze.',
   'Return slowly and stop just before the stack touches.'],
 miss:['Leaning the torso back to get more range.',
   'Slamming the pads apart with momentum.',
   'Rushing through the return.'],
 why:'The glute medius stabilises your pelvis when you walk, run and lunge. It is also what gives the hip that rounded shelf shape rather than a flat, square look.'},

adduction:{n:'Hip Adduction Machine',m:'Inner Thigh',lv:1,hi:['thigh'],
 g:{seat:[150,158,80],stack:[248,92],post:[246]},
 A:{h:[150,156],t:88,n:88,a:250,f:246,th:4,s:278,ft:12,th2:-22,s2:252,a2:254,f2:250},
 B:{h:[150,156],t:88,n:88,a:-8,f:246,th:-8,s:266,ft:0,th2:-8,s2:266,a2:254,f2:250},
 tips:['Start with the pads open only as far as feels like a <b>comfortable stretch</b>, not a maximum one.',
   'Squeeze your knees together and hold for a beat.',
   'Keep your back flat against the pad throughout.',
   'Open slowly on the way back.'],
 miss:['Setting the starting width too wide and straining the groin.',
   'Snapping the knees shut with momentum.',
   'Expecting it to burn off inner-thigh fat — it builds the muscle, the deficit handles the fat.'],
 why:'Trained alongside abduction so the hip is balanced in both directions. Two straight sets, high reps, no ego.'},

calfraise:{n:'Standing Calf Raise',m:'Calves',lv:1,hi:['shin'],
 g:{db:1,db2:1,dbAng:0},
 A:{h:[160,130],t:90,n:90,a:272,f:271,th:268,s:272,ft:0,a2:268,f2:269,th2:272,s2:268},
 B:{h:[160,116],t:90,n:90,a:272,f:271,th:268,s:272,ft:-32,a2:268,f2:269,th2:272,s2:268},
 tips:['Stand with the balls of your feet on a step or plate so your heels can drop <b>below</b> the platform.',
   'Full stretch at the bottom, then rise all the way onto the big toe.',
   'Hold the top squeeze for two full seconds. Calves respond to the pause.',
   'Keep the knee straight but not locked.'],
 miss:['Tiny bouncing reps with no stretch and no squeeze.',
   'Bending the knees to bounce the weight up.',
   'Rushing. Calves are stubborn and only respond to slow, full-range reps.'],
 why:'Calves are mostly genetic but they respond to frequency and time under tension. Four sets a week, slow, is the honest dose.'},

stepup:{n:'Dumbbell Step-Up',m:'Quads · Glutes · Conditioning',lv:2,hi:['thigh','shin'],
 g:{db:1,db2:1,dbAng:0,bench:[204,166,0,74]},
 A:{h:[160,124],t:88,n:88,a:272,f:271,th:296,s:262,ft:0,a2:268,f2:269,th2:272,s2:268},
 B:{h:[178,102],t:88,n:88,a:272,f:271,th:300,s:268,ft:0,a2:268,f2:269,th2:250,s2:280},
 tips:['Use a bench or box around <b>knee height</b>. Higher is not better.',
   'Place the whole foot on the box and drive through the <b>heel</b>, not the toes.',
   'Do not push off the back foot — that is cheating the working leg.',
   'Lower yourself down slowly under control rather than dropping.'],
 miss:['Bouncing off the trailing foot to get up.',
   'Letting the working knee cave inward.',
   'Choosing a box so high the hip has to hike up.'],
 why:'A conditioning-and-strength hybrid. Your heart rate climbs while your glutes and quads work, which is efficient use of a Saturday when you want both.'},

/* ─── CORE ───────────────────────────────────────────────────── */
abmachine:{n:'Abdominal Machine',m:'Rectus Abdominis',lv:1,hi:['torso'],
 g:{seat:[150,162,86],stack:[248,92],post:[246],arm:[240,84],grip:1,grip2:1},
 A:{h:[150,160],t:94,n:94,a:52,f:110,th:-8,s:264,ft:0,a2:56,f2:114,th2:-16,s2:260},
 B:{h:[150,160],t:66,n:62,a:34,f:96,th:-8,s:264,ft:0,a2:38,f2:100,th2:-16,s2:260},
 tips:['Align your <b>torso with the pivot point</b> of the machine — that is the whole setup in one sentence.',
   'Curl your ribs down toward your hips. Think about shortening the distance, not bending at the hips.',
   'Pull with the abs, not by yanking the handles with your arms.',
   'Exhale hard at the bottom of the crunch and hold for a second.'],
 miss:['Using the arms to pull the pad down while the torso stays rigid.',
   'Hinging at the hips instead of flexing the spine.',
   'Going so heavy that the movement turns into a whole-body rock.'],
 why:'Your abs are a muscle like any other and they grow from being loaded. Adding thickness there means they show at a slightly higher body fat than they otherwise would — worth a lot to you specifically.'},

torsorotation:{n:'Torso Rotation Machine',m:'Obliques',lv:1,hi:['torso'],
 g:{seat:[150,162,84],stack:[248,92],post:[246],grip:1,grip2:1},
 A:{h:[150,160],t:96,n:96,a:24,f:16,th:-8,s:264,ft:0,a2:20,f2:12,th2:-16,s2:260},
 B:{h:[150,160],t:84,n:80,a:-14,f:-22,th:-8,s:264,ft:0,a2:-18,f2:-26,th2:-16,s2:260},
 tips:['Lock the <b>hips and legs</b> in place — only the torso rotates.',
   'Move slowly and never let the stack pull you back past your comfortable range.',
   'Light weight and controlled reps. The spine does not like heavy loaded rotation.',
   'Do the same number of reps in each direction.'],
 miss:['Loading it heavy and using the whole body to whip the pad around.',
   'Letting the hips swing along with the torso.',
   'Doing more reps on your strong side.'],
 why:'Obliques wrap around the waist and are what create the visible taper between ribs and hips. Trained lightly on purpose — heavy oblique work can thicken the waist, which is the opposite of what you want.'},

kneeraise:{n:'Captain\'s Chair Knee Raise',m:'Lower Abs · Hip Flexors',lv:2,hi:['thigh'],
 g:{post:[112,208],floor:0,grip:1,grip2:1},
 A:{h:[160,132],t:90,n:90,a:230,f:250,th:268,s:272,ft:-10,a2:310,f2:290,th2:272,s2:268},
 B:{h:[160,132],t:86,n:88,a:230,f:250,th:340,s:266,ft:-10,a2:310,f2:290,th2:344,s2:262},
 tips:['Press your forearms down into the pads and lift your <b>chest tall</b> so you are not hanging from the shoulders.',
   'Raise the knees until your thighs pass horizontal, then curl the <b>hips up</b> at the end. That last bit is the ab work.',
   'Lower slowly with no swinging.',
   'Once you can do 15 clean reps, straighten your legs to make it harder.'],
 miss:['Swinging the legs and using momentum — this makes it a hip flexor exercise only.',
   'Stopping when the knees reach hip height and never curling the pelvis.',
   'Letting the shoulders shrug up to the ears.'],
 why:'The lower abs are the hardest region to reach and the last to show. Curling the pelvis at the end is what separates this from a hip-flexor swing.'},

plank:{n:'Plank',m:'Deep Core · Anti-Extension',lv:1,hi:['torso'],
 g:{mat:[160,192]},
 A:{h:[160,168],t:8,n:8,a:288,f:196,th:186,s:182,ft:60,th2:184,s2:180,a2:284,f2:192},
 B:{h:[160,164],t:6,n:6,a:288,f:196,th:184,s:180,ft:60,th2:182,s2:178,a2:284,f2:192},
 tips:['Elbows directly under the shoulders, forearms flat.',
   'Squeeze your <b>glutes and abs</b> at the same time and tuck the pelvis slightly under.',
   'Straight line from ear to heel. Hips neither sagging nor piked up.',
   'Breathe normally. If you have to hold your breath, the set is over.'],
 miss:['Hips sagging so the lower back takes the load.',
   'Butt in the air, which makes it easy and useless.',
   'Holding for five minutes — a hard 45 seconds beats a lazy three minutes.'],
 why:'This teaches your core to resist your spine being pulled into extension, which is exactly the job it does when you row, press and lunge. Braced core, better lifts, healthier back.'},

sideplank:{n:'Side Plank',m:'Obliques · Lateral Core',lv:2,hi:['torso'],
 g:{mat:[160,192]},
 A:{h:[164,160],t:12,n:12,a:284,f:200,th:184,s:182,ft:60,th2:186,s2:184,a2:60,f2:70},
 B:{h:[164,152],t:10,n:10,a:284,f:200,th:182,s:180,ft:60,th2:184,s2:182,a2:60,f2:70},
 tips:['Elbow directly under the shoulder, body in one straight line from head to feet.',
   'Push the bottom shoulder <b>away from the floor</b> rather than sinking into it.',
   'Stack the feet, or stagger them if balance is hard at first.',
   'Reach the top arm to the ceiling and keep the hips lifted.'],
 miss:['Hips dropping toward the floor as the set goes on.',
   'Rotating the chest toward the floor.',
   'Holding one side longer than the other.'],
 why:'The lateral core is what actually shapes the side of your waist. Trained isometrically so you get the strength without thickening the obliques the way loaded side bends do.'},

bosucrunch:{n:'Bosu Ball Crunch',m:'Rectus Abdominis',lv:1,hi:['torso'],
 g:{bosu:[140,180]},
 A:{h:[180,146],t:194,n:194,a:260,f:100,th:-26,s:258,ft:0,th2:-34,s2:254,a2:256,f2:96},
 B:{h:[180,146],t:148,n:148,a:250,f:80,th:-26,s:258,ft:0,th2:-34,s2:254,a2:246,f2:76},
 tips:['Lie back over the dome so your lower back is supported and your abs start in a <b>stretched</b> position.',
   'Hands at the temples, not laced behind the neck — never pull on your head.',
   'Curl up by bringing the ribs to the hips, exhaling as you go.',
   'Lower all the way back over the dome for the full stretch on each rep.'],
 miss:['Pulling the head forward with the hands.',
   'Sitting all the way up, which turns it into a hip flexor exercise.',
   'Cutting the range short and never using the stretch the dome gives you.'],
 why:'The dome gives you range of motion that a floor crunch cannot. That extra stretch under load is where the abs actually grow.'},

bicycle:{n:'Bicycle Crunch',m:'Obliques · Rectus Abdominis',lv:1,hi:['torso','thigh'],
 g:{mat:[160,196]},
 A:{h:[160,172],t:162,n:158,a:228,f:172,th:320,s:250,ft:0,th2:212,s2:214,a2:312,f2:352},
 B:{h:[160,172],t:162,n:158,a:228,f:172,th:212,s:214,ft:0,th2:320,s2:250,a2:312,f2:352},
 tips:['Bring the <b>shoulder</b> toward the opposite knee, not the elbow. The rotation comes from the ribcage.',
   'Keep the lower back pressed lightly into the mat throughout.',
   'Extend the non-working leg long and low without letting the back arch.',
   'Slow and deliberate beats fast and floppy — 2 seconds per side.'],
 miss:['Racing through reps by flapping the elbows side to side.',
   'Yanking on the neck with the hands.',
   'Letting the lower back arch off the floor when the leg extends.'],
 why:'Hits the obliques and the rectus together with no equipment and no loading of the spine. A clean finisher for your conditioning day.'},

deadbug:{n:'Dead Bug',m:'Deep Core · Anti-Extension',lv:1,hi:['torso'],
 g:{mat:[160,196]},
 A:{h:[160,172],t:184,n:184,a:78,f:80,th:322,s:250,ft:0,th2:318,s2:246,a2:74,f2:76},
 B:{h:[160,172],t:184,n:184,a:78,f:80,th:352,s:348,ft:0,th2:318,s2:246,a2:126,f2:128},
 tips:['Press your <b>lower back flat</b> into the floor and keep it there for every rep. That is the whole exercise.',
   'Extend the opposite arm and leg slowly, and only as far as you can go without the back lifting.',
   'Exhale as you extend, inhale as you return.',
   'If your back arches, shorten the range.'],
 miss:['Moving fast and letting the ribs flare up.',
   'Extending so far the lower back peels off the floor.',
   'Holding the breath.'],
 why:'The safest and most transferable core exercise there is. It teaches the exact bracing pattern you need on RDLs and squats. Two sets in the warm-up primes everything else.'},

cablecrunch:{n:'Cable Kneeling Crunch',m:'Rectus Abdominis (loaded)',lv:2,hi:['torso'],
 g:{post:[254],pulley:[242,40],stack:[254,92],cable:[242,40],rope:1},
 A:{h:[160,168],t:96,n:96,a:64,f:110,th:250,s:182,ft:186,th2:246,s2:178,a2:68,f2:114},
 B:{h:[160,168],t:40,n:30,a:52,f:132,th:250,s:182,ft:186,th2:246,s2:178,a2:56,f2:136},
 tips:['Kneel facing away or toward the stack with the rope beside your head — the hands never move relative to your skull.',
   'Crunch by <b>rounding the spine down</b>, driving the elbows toward the thighs.',
   'Hips stay fixed. If your butt drops toward your heels, you are hinging, not crunching.',
   'Exhale forcefully at the bottom and hold the contraction.'],
 miss:['Pulling with the arms and lats instead of the abs.',
   'Rocking at the hips rather than flexing the spine.',
   'Going so heavy the whole body folds forward.'],
 why:'The only way to add real progressive load to the abs. Crunches with bodyweight stop working once you can do 30 — this one keeps getting harder as you get stronger.'}

});
</script>
<script>
Object.assign(EX,{

/* ─── CONDITIONING ───────────────────────────────────────────── */
thruster:{n:'Dumbbell Thruster',m:'Full Body · Conditioning',lv:3,hi:['thigh','arm','fore'],
 g:{db:1,db2:1,dbAng:0},
 A:{h:[160,158],t:74,n:80,a:22,f:106,th:210,s:302,ft:0,a2:18,f2:110,th2:214,s2:298},
 B:{h:[160,120],t:90,n:90,a:82,f:88,th:268,s:272,ft:0,a2:78,f2:84,th2:272,s2:268},
 tips:['One continuous movement: squat down, then drive up and press overhead in the <b>same motion</b>.',
   'Dumbbells rest on the shoulders at the bottom, elbows up.',
   'Use the leg drive to start the press — do not squat, stop, then press.',
   'Moderate weight. This is a conditioning tool, not a strength lift.'],
 miss:['Pausing between the squat and the press and losing all the momentum.',
   'Arching the back to finish the press when the legs stop helping.',
   'Going so heavy that form falls apart by rep 6.'],
 why:'The most heart-rate for the least time. Three rounds of this at the end of Saturday burns real calories while still being a resistance movement, which protects your muscle in a deficit.'},

kbswing:{n:'Kettlebell Swing',m:'Glutes · Hamstrings · Conditioning',lv:3,hi:['thigh','torso'],
 g:{db:1,dbAng:90},
 A:{h:[156,132],t:38,n:44,a:288,f:280,th:262,s:274,ft:0,a2:284,f2:276,th2:266,s2:270},
 B:{h:[160,122],t:90,n:90,a:352,f:350,th:268,s:272,ft:0,a2:348,f2:346,th2:272,s2:268},
 tips:['This is a <b>hip snap</b>, not a squat and not a front raise. The arms are ropes.',
   'Hike the bell back between your legs like a rugby pass, then drive the hips forward hard.',
   'The bell floats to chest height on its own. Do not lift it with the shoulders.',
   'Snap the glutes at the top and keep the ribs down.'],
 miss:['Squatting the bell up and down instead of hinging.',
   'Using the arms to raise it — your shoulders will be sore instead of your glutes.',
   'Leaning back at the top and hyperextending the lower back.'],
 why:'Explosive hip work that trains the posterior chain and your conditioning at the same time. Planet Fitness has kettlebells in the functional area — use them.'},

battlerope:{n:'Battle Rope Waves',m:'Shoulders · Core · Conditioning',lv:2,hi:['arm','fore'],
 g:{floor:1},
 A:{h:[160,140],t:80,n:84,a:326,f:6,th:246,s:290,ft:0,a2:300,f2:340,th2:250,s2:286},
 B:{h:[160,140],t:80,n:84,a:300,f:340,th:246,s:290,ft:0,a2:326,f2:6,th2:250,s2:286},
 tips:['Athletic stance: feet wide, knees soft, hips back, chest up.',
   'Drive the waves from your <b>hips and core</b>, not just your arms.',
   'Keep the waves fast and even all the way to the anchor.',
   'Alternating waves for endurance, double slams for power. Both work.'],
 miss:['Standing bolt upright and flapping the arms.',
   'Slowing down halfway — better to do 20 hard seconds than 45 sloppy ones.',
   'Gripping the ropes in a death grip and burning out the forearms first.'],
 why:'Zero impact on your knees, enormous heart-rate response, and it works when the treadmills are all taken. Great last station on the conditioning circuit.'},

mountainclimber:{n:'Mountain Climbers',m:'Core · Conditioning',lv:2,hi:['thigh','torso'],
 g:{mat:[160,196]},
 A:{h:[168,158],t:14,n:14,a:280,f:272,th:190,s:186,ft:56,th2:262,s2:212,a2:276,f2:268},
 B:{h:[168,158],t:14,n:14,a:280,f:272,th:262,s:212,ft:56,th2:190,s2:186,a2:276,f2:268},
 tips:['Start in a strong push-up position — hands under shoulders, hips level.',
   'Drive the knee toward your chest without letting your <b>hips bounce up</b>.',
   'Keep the shoulders stacked over the hands the whole time.',
   'Fast feet, still torso.'],
 miss:['Hips rising and falling with every rep.',
   'Hands creeping forward so the shoulders take all the weight.',
   'Half-hearted knee drive that never reaches the chest.'],
 why:'Core, shoulders and cardio at once, no equipment needed. Perfect for the middle of a circuit when the machines are busy.'},

jumprope:{n:'Jump Rope',m:'Calves · Conditioning · Coordination',lv:2,hi:['shin'],
 g:{floor:1},
 A:{h:[160,124],t:90,n:90,a:300,f:340,th:268,s:272,ft:0,a2:240,f2:200,th2:272,s2:268},
 B:{h:[160,114],t:90,n:90,a:296,f:336,th:266,s:268,ft:-24,a2:244,f2:204,th2:270,s2:264},
 tips:['Small jumps — <b>an inch off the floor</b> is plenty. You are not clearing a hurdle.',
   'Turn the rope with your <b>wrists</b>, elbows tucked at your sides.',
   'Land softly on the balls of your feet with soft knees.',
   'Stand tall, eyes forward, shoulders relaxed.'],
 miss:['Jumping high and landing hard, which beats up the knees and ankles.',
   'Swinging the whole arms in big circles.',
   'Going to failure on coordination instead of stopping at a clean 45–60 seconds.'],
 why:'You already own a rope. It is the most efficient calorie burn per minute available and it trains your calves and ankles for free.'},

pushup:{n:'Push-Up',m:'Chest · Triceps · Core',lv:1,hi:['arm','fore'],
 g:{mat:[160,198]},
 A:{h:[164,166],t:10,n:10,a:274,f:270,th:188,s:184,ft:58,th2:186,s2:182,a2:270,f2:266},
 B:{h:[164,180],t:8,n:8,a:250,f:308,th:186,s:182,ft:58,th2:184,s2:180,a2:246,f2:304},
 tips:['Hands just outside shoulder width, elbows tracking back at about <b>45°</b>, not flared to the sides.',
   'Squeeze the glutes and abs so your body is one rigid plank.',
   'Chest to within a fist of the floor, then press away and push the floor down.',
   'If full push-ups are too hard, put your hands on a bench rather than dropping to your knees.'],
 miss:['Hips sagging or sticking up in the air.',
   'Head craning forward to touch the floor first.',
   'Elbows flared straight out at 90°, which grinds the shoulder joint.'],
 why:'A warm-up movement here, not a main lift. Two easy sets get blood into the chest and shoulders before you load them.'},

/* ─── WARM-UP / PREP ─────────────────────────────────────────── */
bandpull:{n:'Band Pull-Apart',m:'Rear Delt · Upper Back (prep)',lv:1,hi:['arm','fore'],
 g:{},
 A:{h:[160,124],t:90,n:90,a:6,f:2,th:268,s:272,ft:0,a2:2,f2:-2,th2:272,s2:268},
 B:{h:[160,124],t:90,n:90,a:150,f:146,th:268,s:272,ft:0,a2:158,f2:154,th2:272,s2:268},
 tips:['Hold a light band at shoulder height with straight arms.',
   'Pull the band apart by squeezing the <b>shoulder blades together</b>, not by bending the elbows.',
   'Bring it to your chest, hold for a second, and return slowly.',
   'Use a band light enough for 15–20 clean reps.'],
 miss:['Bending the elbows to make it easier.',
   'Shrugging the shoulders up toward the ears.',
   'Snapping the band back instead of controlling it.'],
 why:'Wakes up the rear delts and upper back before you press or pull. Sixty seconds here makes every set that follows feel more stable.'},

const K='forge.v1';
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dk(new Date());

let ST={start:today(),log:{},hist:{},body:[],q:0};
try{const r=localStorage.getItem(K); if(r) ST=Object.assign(ST,JSON.parse(r));}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(ST))}catch(e){}};

/* Mon=0 … Sat=5, Sun=6(rest) */
const progIdx=d=>(d.getDay()+6)%7;
const dayOf=i=>i>=6?REST:PROG[i];
const daysSince=()=>{const a=new Date(ST.start+'T00:00:00'),b=new Date(today()+'T00:00:00');return Math.max(0,Math.round((b-a)/864e5))};
const progWeek=()=>Math.min(12,Math.floor(daysSince()/7)+1);
const uid=(dK,bi,ei,id)=>dK+'-'+bi+'-'+ei+'-'+id;

function dayEx(day){const out=[];day.b.forEach((bl,bi)=>bl.ex.forEach((x,ei)=>out.push({x,bi,ei,u:uid(day.k,bi,ei,x.id)})));return out}
function rec(date){ST.log[date]=ST.log[date]||{sets:{}};return ST.log[date]}
function setsOf(date,u,n){const r=rec(date);if(!r.sets[u])r.sets[u]=Array.from({length:n},()=>({w:'',r:'',f:false}));
  while(r.sets[u].length<n)r.sets[u].push({w:'',r:'',f:false});return r.sets[u]}
const exDone=(date,u,n)=>{const s=(ST.log[date]||{sets:{}}).sets[u];return !!s&&s.length>=n&&s.slice(0,n).every(v=>v.f)};
const exPart=(date,u)=>{const s=(ST.log[date]||{sets:{}}).sets[u];return s?s.filter(v=>v.f).length:0};

function dayPct(date,day){if(!day.b.length)return 0;const all=dayEx(day);let n=0;
  all.forEach(o=>{if(exDone(date,o.u,o.x.s))n++});return n/all.length}
function sessionDone(date){const d=new Date(date+'T00:00:00'),i=progIdx(d),day=dayOf(i);
  if(!day.b.length)return false;return dayPct(date,day)>=.7}

function streak(){let c=0,d=new Date();
  for(let i=0;i<400;i++){const key=dk(d),idx=progIdx(d);
    if(idx>=6){d.setDate(d.getDate()-1);continue}
    if(sessionDone(key)){c++}else if(key!==today()){break}
    d.setDate(d.getDate()-1)}
  return c}
function bestStreak(){let best=0,cur=0;
  const keys=Object.keys(ST.log).sort(), from=keys.length&&keys[0]<ST.start?keys[0]:ST.start;
  const d=new Date(from+'T00:00:00'),end=new Date();
  while(d<=end){const key=dk(d);if(progIdx(d)<6){if(sessionDone(key)){cur++;best=Math.max(best,cur)}else if(key!==today()){cur=0}}
    d.setDate(d.getDate()+1)}
  return Math.max(best,streak())}
const totalSessions=()=>Object.keys(ST.log).filter(k=>sessionDone(k)).length;
function weekDone(){let n=0;const d=new Date(),off=progIdx(d);
  for(let i=0;i<6;i++){const t=new Date(d);t.setDate(d.getDate()-off+i);if(t<=d&&sessionDone(dk(t)))n++}
  return n}

/* ── history for progressive overload ────────────────────────── */
function pushHist(id,w,r){if(!w&&!r)return;ST.hist[id]=ST.hist[id]||[];
  const t=today(),h=ST.hist[id],last=h[h.length-1];
  if(last&&last.d===t){if((+w||0)*(+r||0)>=(+last.w||0)*(+last.r||0)){last.w=w;last.r=r}}
  else h.push({d:t,w:w,r:r});
  if(h.length>60)h.shift()}
function lastSet(id){const h=ST.hist[id];if(!h||!h.length)return null;
  for(let i=h.length-1;i>=0;i--) if(h[i].d!==today()) return h[i];
  return null}

/* ── atmosphere keyed to the day ─────────────────────────────── */
function sky(c){const b=document.querySelectorAll('#sky b');
  const mix=(a,p)=>a+Math.round(p*255).toString(16).padStart(2,'0');
  const shades=[c+'42',c+'26','#7C6BF52e',c+'1f','#0F131E'];
  b.forEach((el,i)=>el.style.background=shades[i]||c+'22');
  document.documentElement.style.setProperty('--acc',c);
  $('c1').setAttribute('stroke',c)}

/* ── rings ───────────────────────────────────────────────────── */
function ring(el,r,p){const c=2*Math.PI*r;el.setAttribute('stroke-dasharray',c);
  el.setAttribute('stroke-dashoffset',c*(1-Math.max(0,Math.min(1,p))))}

/* ══ HOME ══ */
function renderHome(){
  const now=new Date(),i=progIdx(now),day=dayOf(i);
  sky(day.c);
  const h=now.getHours();
  const part=h<11?'Morning':h<16?'Afternoon':h<21?'Evening':'Tonight';
  $('stamp').textContent=now.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}).toUpperCase();
  $('greet').innerHTML=day.b.length?part+' — <em>'+day.n+'</em>':part+' — <em>Rest</em>';

  const qi=(daysSince())%QUOTES.length, q=QUOTES[qi];
  $('quote').innerHTML='“'+q[0]+'”<span class="by">'+(q[1]==='—'?'':q[1])+'</span>';

  const dp=dayPct(today(),day), wd=weekDone(), pw=progWeek();
  ring($('c1'),60,day.b.length?dp:1); ring($('c2'),47,wd/6); ring($('c3'),34,pw/12);
  $('wkn').textContent=pw;
  $('legend').innerHTML=
   `<div class="leg"><i style="background:${day.c}"></i><div class="t">${day.b.length?Math.round(dp*100)+'% of today done':'Recovery day'}<b>${day.n}</b></div></div>
    <div class="leg"><i style="background:#4EA8F5"></i><div class="t">${wd} of 6 sessions<b>This week</b></div></div>
    <div class="leg"><i style="background:#8BD94A"></i><div class="t">Week ${pw} · ${phaseOf(pw)[2]}<b>Block one</b></div></div>`;

  $('whint').textContent=streak()>0?streak()+' day streak':'';

  /* week rail */
  const wrap=$('week');let s='';
  const list=PROG.concat([REST]);
  list.forEach((d,idx)=>{
    const dt=new Date(now); dt.setDate(now.getDate()-i+idx);
    const key=dk(dt), isToday=idx===i, p=d.b.length?dayPct(key,d):0;
    const done=d.b.length&&p>=.7;
    s+=`<div class="day${isToday?' today':''}${done?' done':''}${d.b.length?'':' rest'}" style="--c:${d.c};animation-delay:${.05*idx}s" onclick="openDay(${idx})">
      <div class="dot"><b>${d.d.toUpperCase()}</b><span>${dt.getDate()}</span></div>
      <div class="bd"><div class="nm">${d.n}</div><div class="ds">${d.t}</div></div>
      <div class="rt">${d.b.length?`<div class="pct">${Math.round(p*100)}%</div><div class="mini"><i style="width:${p*100}%"></i></div>`:'<div class="pct">—</div>'}</div>
    </div>`});
  wrap.innerHTML=s;

  renderPanels();
}

function targets(){
  const b=ST.body.filter(x=>+x.w).pop(); if(!b) return null;
  const w=+b.w, r=(n,step)=>Math.round(n/step)*step;
  return {w:w, lo:r(w*28,50), hi:r(w*32,50), kcal:r(w*30-400,50), pro:r(w*1.9,5)};
}
function phaseOf(w){for(const p of PHASE) if(w>=p[0]&&w<=p[1]) return p; return PHASE[PHASE.length-1]}

function renderPanels(){
  const pw=progWeek();
  let s='';

  /* consistency */
  let grid='';const st=new Date(ST.start+'T00:00:00'),tk=today();
  for(let i=0;i<84;i++){const d=new Date(st);d.setDate(st.getDate()+i);const key=dk(d);
    const future=key>tk, idx=progIdx(d);
    let cl=''; if(!future){ if(idx>=6) cl='p'; else if(sessionDone(key)) cl='f'; }
    if(key===tk) cl+=' t';
    grid+=`<i class="${cl}"></i>`}
  s+=`<div class="sec">Consistency</div>
   <div class="panel"><h3>The grid <span class="n">12 weeks</span></h3>
    <div class="hm">${grid}</div>
    <div class="stats">
      <div class="stat"><b style="color:var(--mint)">${streak()}</b><span>Streak</span></div>
      <div class="stat"><b>${bestStreak()}</b><span>Best</span></div>
      <div class="stat"><b>${totalSessions()}</b><span>Sessions</span></div>
    </div>
    <p style="margin-top:15px">Six marks a week is a perfect week. Five is still a great one. The grid is not there to shame a missed day — it is there so a missed <b>week</b> cannot hide from you.</p>
   </div>`;

  /* phase table */
  let rows='';PHASE.forEach(p=>{const now=pw>=p[0]&&pw<=p[1];
    rows+=`<tr class="${now?'now':''}"><td>${p[0]===p[1]?'Wk '+p[0]:'Wk '+p[0]+'–'+p[1]}</td><td><b style="color:var(--ink)">${p[2]}</b> — ${p[3]}</td></tr>`});
  s+=`<div class="sec">The block</div>
   <div class="panel"><h3>How the load moves <span class="n">week ${pw} of 12</span></h3>
    <p>The split does not change week to week. <b>What changes is how hard you push and how much weight is on the machine.</b> That is the entire secret, and it is the part most people skip.</p>
    <table><tbody>${rows}</tbody></table>
    <p style="margin-top:14px">The rule for adding weight: when you hit the <b>top of the rep range on every set</b> of an exercise, add the smallest increment available next session. That is progressive overload and it is the only thing that actually forces the body to change.</p>
   </div>`;

  /* numbers — derived from your logged weight, nothing baked into this file */
  const T=targets();
  s+=`<div class="sec">Your numbers</div>
   <div class="panel"><h3>Recomposition math</h3>
    <div class="stats" style="margin-bottom:15px">
      <div class="stat"><b style="color:var(--volt)">${T?T.kcal.toLocaleString():'—'}</b><span>kcal / day</span></div>
      <div class="stat"><b style="color:var(--mint)">${T?T.pro:'—'}</b><span>g protein</span></div>
      <div class="stat"><b>3–4</b><span>L water</span></div>
    </div>
    ${T?`<p>At <b>${T.w} kg</b> your maintenance is roughly <b>${T.lo.toLocaleString()}–${T.hi.toLocaleString()} kcal</b> once six training days are factored in. Eating around <b>${T.kcal.toLocaleString()}</b> puts you in a deficit of about 0.4–0.5 kg per week — slow enough to keep every gram of muscle you build.</p>
    <p><b>Protein is the non-negotiable</b> — it is what lets you add muscle while eating in a deficit. A whey shake covers roughly 60 g of your ${T.pro} g. The rest comes from food: two eggs is 12, a 200 g chicken breast is about 60, a cup of curd is 11.</p>`
    :`<p>Log your weight once in the <b>Body log</b> below and your calorie and protein targets appear here, calculated from it. Nothing is stored anywhere but this phone.</p>
    <p>The short version while you wait: eat roughly <b>400 kcal below maintenance</b> and hit <b>1.9 g of protein per kg of bodyweight</b>. That combination is what lets you lose fat and add muscle at the same time.</p>`}
    <p>Weigh yourself the same way every morning — after the bathroom, before food or water — and read the <b>weekly average</b>, never a single day. Take a tape measure to your navel once a week. For belly fat specifically, the tape tells the truth long before the scale does.</p>
    <p>Sleep 7–8 hours. It sounds like the soft advice in the list. It is not — short sleep raises the share of your weight loss that comes from muscle instead of fat, which is exactly the opposite of what you are doing all this for.</p>
   </div>`;

  /* body log */
  const b=ST.body.slice(-14);
  let spark='';
  if(b.length>1){
    const ws=b.map(x=>+x.w).filter(x=>x), mn=Math.min(...ws), mx=Math.max(...ws), rg=(mx-mn)||1;
    const pts=b.map((x,i)=>[10+i*(300/(b.length-1)),48-((+x.w-mn)/rg)*40]);
    const d='M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L');
    spark=`<svg class="spark" viewBox="0 0 320 56" preserveAspectRatio="none">
      <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">

      <path d="${d}"/><circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="3.5"/></svg>
      <p style="font-family:var(--mono);font-size:10.5px;letter-spacing:1px;color:var(--dim);margin-bottom:12px">

  const lastB=ST.body[ST.body.length-1];
  s+=`<div class="sec">Body log</div>
   <div class="panel"><h3>Weekly check <span class="n">${lastB?lastB.d:'no entries'}</span></h3>
    ${spark}
    <div class="logrow">
      <label><span>Weight (kg)</span><input type="number" step="0.05" id="bw" placeholder="${lastB&&lastB.w?lastB.w:'kg'}"></label>
      <label><span>Waist (cm)</span><input type="number" step="0.5" id="bwa" placeholder="${lastB&&lastB.waist?lastB.waist:'—'}"></label>
    </div>
    <button class="btn pri" onclick="logBody()">Save today's numbers</button>
    <p style="margin-top:13px">Same time, same conditions, once or twice a week. The waist measurement is the one that will move first.</p>
   </div>`;

  /* data */
  s+=`<div class="sec">Data</div>
   <div class="panel"><h3>This phone only</h3>
    <p>Started <b>${new Date(ST.start+'T00:00:00').toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'})}</b>. Everything you log lives on this device. Save a copy before you switch phones.</p>
    <div class="two"><button class="btn" onclick="expo()">Export</button><button class="btn" onclick="imp.click()">Import</button></div>
    <input type="file" id="imp" accept="application/json,.json" style="display:none" onchange="impo(this)">
    <p class="credit">Demonstration figures from the Free Exercise DB, images by Everkinetic,
     licensed <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>.
     Loaded on demand and cached on this device.</p>
   </div>
   <div class="nudge">Six days a week, twelve weeks. You will not see it in the mirror<br>until about week five. Keep going anyway — that is the whole job.</div>
   <div class="foot">Forge<br>Built for one person</div>`;

  $('homepanels').innerHTML=s;
}

function logBody(){const w=$('bw').value,wa=$('bwa').value;if(!w&&!wa)return;
  const t=today(),ex=ST.body.find(x=>x.d===t);
  if(ex){if(w)ex.w=w;if(wa)ex.waist=wa}else{ST.body.push({d:t,w:w,waist:wa})}
  save();renderPanels();buzz(12)}

/* ══ DAY ══ */
let curDay=0;
function openDay(i){
  curDay=i;const day=dayOf(i);sky(day.c);
  const now=new Date(),dt=new Date(now);dt.setDate(now.getDate()-progIdx(now)+i);
  const key=dk(dt),isToday=key===today();
  let s=`<div class="dayhero">
    <div class="kick">${day.d}day${isToday?' · Today':''}</div>
    <h2>${day.n}</h2>
    <div class="sub">${day.sub}</div>`;

  if(day.b.length){
    const all=dayEx(day),doneN=all.filter(o=>exDone(key,o.u,o.x.s)).length;
    let sets=0,mins=0;
    day.b.forEach(bl=>bl.ex.forEach(x=>{sets+=x.s;
      const m=String(x.r).match(/(\d+)\s*min/); if(m)mins+=+m[1]*x.s}));
    s+=`<div class="meta">
      <div><b>${all.length}</b><span>Movements</span></div>
      <div><b>${sets}</b><span>Total sets</span></div>
      <div><b style="color:${doneN===all.length?'var(--mint)':'var(--ink)'}">${doneN}/${all.length}</b><span>Done</span></div>
    </div></div>`;
    day.b.forEach((bl,bi)=>{
      s+=`<div class="grp">${bl.g}<span class="c">${bl.n}</span></div>`;
      bl.ex.forEach((x,ei)=>{
        const u=uid(day.k,bi,ei,x.id),E=EX[x.id],dn=exDone(key,u,x.s),pt=exPart(key,u);
        let dots='';for(let q=0;q<x.s;q++)dots+=`<i class="${q<pt?'f':''}"></i>`;
        s+=`<div class="item${dn?' done':''}" style="animation-delay:${.03*(ei)}s" onclick="openEx(${i},${bi},${ei})">
          <div class="thumb">${thumb(x.id)}</div>
          <div class="bd"><div class="nm">${E.n}</div>
            <div class="ds">${x.r}${x.s>1?' <em>·</em> '+x.s+' sets':''}</div></div>
          <div class="go"><div class="setdots">${dots}</div>
            <svg class="chev" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
        </div>`})});
    const p=dayPct(key,day);
    if(p>=.999){s+=`<div class="fin"><svg class="mk" viewBox="0 0 46 46"><circle cx="23" cy="23" r="21"/><polyline points="14 24 20 30 32 17"/></svg>
      <div class="t">Session complete</div><div class="s">Every set logged. Walk out clean — the last five minutes count as much as the first ninety.</div></div>`}
  }else{
    s+=`</div><div class="panel"><h3>What rest actually does</h3>
      <p>Training is the <b>signal</b>. Growth is the <b>response</b>, and it happens while you sleep and eat, not while you lift. Six hard days need one honest one.</p>
      <p>If you want to move: a 30–45 minute walk outdoors, easy pace. That burns fat without adding fatigue to recover from.</p>
      <p><b>Keep your protein target today too.</b> Recovery is when your body is actually using it.</p>
      <p>Get to bed early. Sunday night sleep sets up the whole week that follows.</p></div>`}
  $('daybody').innerHTML=s;go('day');
}

function thumb(id){const E=EX[id];
  const m=(typeof resolve==='function')?resolve(id):null;
  if(m&&m.f&&m.f.length) return `<img class="thi" src="${m.f[0]}" alt="" loading="lazy"
     onerror="this.parentNode.innerHTML=svgThumb('${id}')">`;
  return svgThumb(id)}
function svgThumb(id){const E=EX[id];const p=tween(E.A,E.B,.68);
  return `<svg viewBox="34 22 252 200" preserveAspectRatio="xMidYMid meet">${drawFig(p,E.g,E.hi)}</svg>`}

/* ══ EXERCISE ══ */
let anim=null,curEx=null;
function openEx(di,bi,ei){
  const day=dayOf(di),x=day.b[bi].ex[ei],E=EX[x.id];
  const now=new Date(),dt=new Date(now);dt.setDate(now.getDate()-progIdx(now)+di);

  const lv=['Beginner','Intermediate','Advanced'][E.lv-1];

    ${stageHTML(x.id,E)}

      <div class="fact"><div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.4"/><path d="M12 8v7M12 15l-3 6M12 15l3 6M6 10l6-1 6 1"/></svg></div>${E.m}</div>
      <div class="fact"><div class="ic"><svg viewBox="0 0 24 24"><path d="M3 12h3l2-6 4 12 3-8 2 2h4"/></svg></div>${x.s} ${x.s>1?'sets':'set'} · ${x.r}${x.rest?' · '+x.rest+'s rest':''}</div>
    </div>

    <div class="panel"><h3>Log your sets</h3>
      ${L?`<div class="last">Last time · <b>${L.w||'—'}${L.w?' lb':''}</b> × <b>${L.r||'—'}</b> reps <span style="color:var(--dim)">· ${L.d}</span></div>`:
          `<div class="last">First time logging this — whatever you use today becomes the number to beat.</div>`}
      <div class="sets" id="sets"></div>
    </div>

    <div class="panel"><h3>Perfect form <span class="n">${E.tips.length} cues</span></h3>
      <ul class="tips good">${E.tips.map(t=>`<li><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>${t}</li>`).join('')}</ul>
    </div>

    <div class="panel"><h3>What goes wrong</h3>
      <ul class="tips bad">${E.miss.map(t=>`<li><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>${t}</li>`).join('')}</ul>
    </div>

    <div class="panel"><h3>Why it is in your plan</h3><p>${E.why}</p>
      ${x.note?`<p style="color:var(--ink);border-left:2px solid var(--acc);padding-left:13px">${x.note}</p>`:''}</div>
    <div style="height:14px"></div>
  </div>`;
  $('exbody').innerHTML=s;

function renderSets(){
  const {x,key,u}=curEx, arr=setsOf(key,u,x.s), isTime=/sec|min/.test(x.r);
  let s='';
  arr.slice(0,x.s).forEach((v,i)=>{
    s+=`<div class="setrow${v.f?' f':''}" id="sr${i}">
      <div class="no">SET ${i+1}</div>
      <div class="fld"><input type="number" inputmode="decimal" placeholder="${isTime?'—':'lb'}" value="${v.w}" oninput="setVal(${i},'w',this.value)"></div>
      <div class="u">×</div>
      <div class="fld"><input type="number" inputmode="numeric" placeholder="${isTime?'sec':'reps'}" value="${v.r}" oninput="setVal(${i},'r',this.value)"></div>
      <div class="tick" onclick="tick(${i})"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
    </div>`});
  $('sets').innerHTML=s;
}
function setVal(i,f,v){const {x,key,u}=curEx;setsOf(key,u,x.s)[i][f]=v;save()}
function tick(i){const {x,key,u,E}=curEx,a=setsOf(key,u,x.s);
  a[i].f=!a[i].f;
  const row=$('sr'+i); row.classList.toggle('f',a[i].f);
  if(a[i].f){pushHist(x.id,a[i].w,a[i].r);buzz(14);if(x.rest)startRest(x.rest,E.n)}
  save();
}

/* ── animation ───────────────────────────────────────────────── */
let playing=true;
function startAnim(E){
  stopAnim();setPlayIcon();
  if(!$('figg'))return;
  const g=$('figg'),ph=$('phase'),scr=$('scr');
  let t0=performance.now();
  const DUR=2600;
  const loop=now=>{
    if(playing){
      const p=((now-t0)%DUR)/DUR;
      const tri=p<.5?p*2:(1-p)*2;
      const k=tri*tri*(3-2*tri);
      g.innerHTML=drawFig(tween(E.A,E.B,k),E.g,E.hi);
      scr.style.width=(k*100)+'%';
      ph.textContent=k<.12?'Start position':k>.88?'Peak contraction':(p<.5?'Working':'Return — slow');
    }
    anim=requestAnimationFrame(loop)};
  anim=requestAnimationFrame(loop);
}
function stopAnim(){if(anim)cancelAnimationFrame(anim);anim=null}
function togglePlay(){playing=!playing;setPlayIcon()}
function setPlayIcon(){$('pico').innerHTML=playing
  ?'<rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect>'
  :'<polygon points="7 4 20 12 7 20" fill="currentColor"></polygon>'}

/* ── rest timer ──────────────────────────────────────────────── */
let rT=null,rLeft=0,rTot=0;
function startRest(sec){
  if(!$('s-ex').classList.contains('on')) return;   /* only ever on an exercise */
  rLeft=sec;rTot=sec;$('rest').classList.add('on');tickRest();
  clearInterval(rT);rT=setInterval(()=>{rLeft--;tickRest();
    if(rLeft<=0){clearInterval(rT);buzz([18,70,18]);setTimeout(stopRest,1200)}},1000)}
function tickRest(){const m=Math.floor(Math.max(0,rLeft)/60),s=Math.max(0,rLeft)%60;
  $('rt').textContent=rLeft<=0?'Go':m+':'+pad(s);
  const c=2*Math.PI*12;const el=$('ra');el.setAttribute('stroke-dasharray',c);
  el.setAttribute('stroke-dashoffset',c*(1-Math.max(0,rLeft)/rTot))}
function addRest(n){rLeft+=n;rTot=Math.max(rTot,rLeft);tickRest()}
function stopRest(){clearInterval(rT);$('rest').classList.remove('on')}

function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

/* ── nav ─────────────────────────────────────────────────────── */
function go(name){
  ['home','day','ex'].forEach(n=>$('s-'+n).classList.toggle('on',n===name));
  if(name!=='ex'){stopAnim();stopShots();stopRest()}
  if(name==='home'){renderHome()}
  window.scrollTo({top:0,behavior:'instant'});
}

/* ── data ────────────────────────────────────────────────────── */
function expo(){const blob=new Blob([JSON.stringify(ST,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='forge-'+today()+'.json';a.click()}
function impo(el){const f=el.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{ST=Object.assign(ST,JSON.parse(r.result));save();renderHome()}catch(e){}};
  r.readAsText(f)}

/* ── installable: build the manifest from the embedded icon ──── */
(function(){try{
  var ic=document.querySelector('link[rel="apple-touch-icon"]').getAttribute('href');
  var m={name:'Forge',short_name:'Forge',display:'standalone',orientation:'portrait',
    background_color:'#0A0C12',theme_color:'#0A0C12',start_url:'./',scope:'./',
    icons:[{src:ic,sizes:'512x512',type:'image/png',purpose:'any'},
           {src:ic,sizes:'192x192',type:'image/png',purpose:'any'}]};
  document.querySelector('link[rel="manifest"]').href=
    URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));
}catch(e){}})();

/* ── boot ────────────────────────────────────────────────────── */
const sEl=document.createElement('style');sEl.textContent=FIGCSS;document.head.appendChild(sEl);
renderHome();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&$('s-home').classList.contains('on'))renderHome()});
</script>
<script>
/* ══════════════════════════════════════════════════════════════
   FORM MEDIA
   Real demonstration figures resolved at runtime against the
   Free Exercise DB (images by Everkinetic, CC BY-SA 4.0).
   Nothing is hardcoded — the app fuzzy-matches each movement
   against the live index and caches the result on device.
   ══════════════════════════════════════════════════════════════ */
const CDN='https://cdn.jsdelivr.net/gh/yuhonas/free-exercise-db@main/';
const IDX_URL=CDN+'dist/exercises.json';
const IDXK='forge.idx.v1', MAPK='forge.map.v1';

/* search phrase per movement — guides the matcher, never trusted blindly */
const QMAP={
 smithbench:'smith machine bench press',      inclinedb:'incline dumbbell press',
 chestpress:'machine bench press',            pecdeck:'butterfly pec deck',
 cablefly:'cable crossover',                  latpulldown:'wide grip lat pulldown',
 seatedrow:'seated cable rows',               assistedpullup:'pullups',
 dbrow:'one arm dumbbell row',                straightarm:'straight arm pulldown',
 facepull:'face pull',                        backext:'hyperextensions back extensions',
 shoulderpress:'machine shoulder military press', dbshoulder:'seated dumbbell shoulder press',
 lateralraise:'side lateral raise',           cablelateral:'cable lateral raise one arm',
 reardelt:'reverse machine flyes',            frontraise:'front dumbbell raise',
 shrug:'dumbbell shrug',                      dbcurl:'dumbbell bicep curl',
 hammer:'hammer curls',                       pushdown:'triceps pushdown rope attachment',
 overheadtri:'seated triceps press', cableoverhead:'cable rope overhead triceps extension',
 legpress:'leg press',                        smithsquat:'smith machine squat',
 legext:'leg extensions',                     legcurl:'seated leg curl',
 rdl:'romanian deadlift dumbbell',            lunge:'dumbbell lunges walking',
 goblet:'goblet squat',                       hipthrust:'barbell hip thrust',
 abduction:'thigh abductor',                  adduction:'thigh adductor',
 calfraise:'standing dumbbell calf raise',    stepup:'dumbbell step ups',
 abmachine:'crunches',               torsorotation:'torso rotation oblique machine',
 kneeraise:'hanging knee raise',              plank:'plank',
 sideplank:'side bridge plank',               bosucrunch:'exercise ball crunch',
 bicycle:'air bike bicycle crunch',           deadbug:'dead bug',
 cablecrunch:'cable crunch kneeling',         thruster:'dumbbell thruster',
 kbswing:'kettlebell swing',                  battlerope:'battling ropes',
 mountainclimber:'mountain climbers',         jumprope:'rope jumping',
 pushup:'pushups',                            bandpull:'band pull apart',
 armcircle:'arm circles',                     bwsquat:'bodyweight squat',
 scappull:'scapular pull up',            inclinewalk:'walking treadmill',
 elliptical:'elliptical trainer',             stepmill:'stairmaster stair climber',
 bikeintervals:'stationary bike cycling',     rowerg:'rowing machine',
 cooldown:'walking'
};

let IDX=null, MAP={};
try{MAP=JSON.parse(localStorage.getItem(MAPK)||'{}')}catch(e){}

const norm=s=>s.toLowerCase().replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
const STOP={the:1,a:1,with:1,and:1,of:1,on:1,to:1};
const toks=s=>norm(s).split(' ').filter(w=>w&&!STOP[w]);

function score(q,name){
  const A=toks(q), B=toks(name);
  if(!A.length||!B.length) return 0;
  let hit=0; A.forEach(w=>{if(B.indexOf(w)>=0)hit++});
  if(!hit) return 0;
  let s = hit/A.length*100 + hit/B.length*45;          // cover the query, prefer tight names
  if(norm(name)===norm(q)) s+=70;
  if(norm(name).indexOf(norm(q))>=0) s+=25;
  s -= Math.max(0,B.length-A.length)*3.5;              // punish sprawling variant names
  return s;
}

function resolve(id){
  if(MAP[id]!==undefined) return MAP[id];
  if(!IDX) return undefined;
  const q=QMAP[id]; if(!q){MAP[id]=null;return null}
  let best=null,bs=28;
  for(const e of IDX){const s=score(q,e.name); if(s>bs){bs=s;best=e}}
  MAP[id]= best&&best.images&&best.images.length
    ? {f:best.images.map(p=>CDN+'exercises/'+p), n:best.name} : null;
  try{localStorage.setItem(MAPK,JSON.stringify(MAP))}catch(e){}
  return MAP[id];
}

async function loadIdx(){
  if(IDX) return IDX;
  try{const c=localStorage.getItem(IDXK); if(c){IDX=JSON.parse(c); return IDX}}catch(e){}
  try{
    const r=await fetch(IDX_URL,{cache:'force-cache'});
    if(!r.ok) throw 0;
    const raw=await r.json();
    IDX=raw.map(e=>({name:e.name,images:e.images})).filter(e=>e.images&&e.images.length);
    try{localStorage.setItem(IDXK,JSON.stringify(IDX))}catch(e){}
  }catch(e){IDX=null}
  return IDX;
}

const ytLink=name=>'https://www.youtube.com/results?search_query='+
  encodeURIComponent(name+' proper form technique');

/* ── the stage: real figure, two-frame loop, SVG fallback ────── */
function stageHTML(id,E){
  const m=resolve(id);
  const frames=m&&m.f.length?m.f:null;
  return `<div class="stage${frames?' shot':''}" id="stg">
    <div class="plate" id="plate">
      ${frames?frames.slice(0,2).map((u,i)=>
        `<img class="fr${i===0?' on':''}" src="${u}" alt="" loading="eager"
              onerror="figFail()">`).join(''):''}
      <svg class="figsvg${frames?'':' on'}" id="figsvg" viewBox="0 0 320 226"><g id="figg"></g></svg>
    </div>
    <div class="stagebar">
      <button onclick="togglePlay()" id="pbtn" aria-label="Play or pause">
        <svg viewBox="0 0 24 24" id="pico"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      </button>
      <div class="scrub"><i id="scr"></i></div>
      <div class="ph" id="phase">Start position</div>
      <a class="vid" href="${ytLink(E.n)}" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24"><polygon points="9 7 18 12 9 17"/><rect x="2.5" y="4" width="19" height="16" rx="4"/></svg>Form
      </a>
    </div>
  </div>
  <div class="srcline">${frames?'Showing <b>'+m.n.replace(/_/g,' ')+'</b>'
      :(IDX?'No demo matched this one':'Demo images need a connection')}
    <button onclick="openPick()">${frames?'not this?':'pick one'}</button></div>`;
}

/* ── correct a bad auto-match by hand ────────────────────────── */
function openPick(){
  if(!IDX){alert('Demo library still loading — needs a connection the first time.');return}
  const o=document.createElement('div');o.className='pick';o.id='pick';
  o.innerHTML=`<div class="pbox">
    <div class="phd">Pick the right demonstration
      <button onclick="closePick()" aria-label="Close">✕</button></div>
    <input id="pq" placeholder="Search the library…" autocomplete="off">
    <div class="plist" id="plist"></div></div>`;
  document.body.appendChild(o);
  $('pq').addEventListener('input',e=>pickSearch(e.target.value));
  pickSearch(QMAP[curEx.x.id]||curEx.E.n);
  $('pq').value=QMAP[curEx.x.id]||'';
}
function closePick(){const p=$('pick');if(p)p.remove()}
function pickSearch(v){
  const q=(v||'').trim(); const L=$('plist'); if(!L)return;
  const hits=IDX.map(e=>({e,s:q?score(q,e.name):0}))
    .filter(h=>q?h.s>0:true).sort((a,b)=>b.s-a.s).slice(0,40);
  L.innerHTML=hits.map(h=>`<div class="prow" onclick="pickSet('${h.e.name.replace(/'/g,"\\'")}')">
    <img src="${CDN+'exercises/'+h.e.images[0]}" alt="" loading="lazy">
    <span>${h.e.name.replace(/_/g,' ')}</span></div>`).join('')||'<p class="pnone">Nothing matched that.</p>';
}
function pickSet(name){
  const e=IDX.find(x=>x.name===name); if(!e)return;
  MAP[curEx.x.id]={f:e.images.map(p=>CDN+'exercises/'+p), n:e.name};
  try{localStorage.setItem(MAPK,JSON.stringify(MAP))}catch(err){}
  closePick(); openEx(curEx.di,curEx.bi,curEx.ei);
}

function figFail(){
  const p=$('plate'); if(!p) return;
  p.querySelectorAll('.fr').forEach(i=>i.remove());
  const s=$('figsvg'); if(s){s.classList.add('on'); const st=$('stg'); if(st)st.classList.remove('shot')}
  if(curEx) startAnim(curEx.E);
}

/* two-frame demonstration loop */
let shotT=null;
function startShots(){
  stopShots();
  const fr=document.querySelectorAll('#plate .fr');
  if(fr.length<2){ if(fr.length===1){fr[0].classList.add('on')} return }
  let k=0; const ph=$('phase'), scr=$('scr');
  const step=()=>{
    k^=1;
    fr.forEach((el,i)=>el.classList.toggle('on',i===k));
    if(ph) ph.textContent=k?'End position':'Start position';
    if(scr) scr.style.width=(k?100:0)+'%';
  };
  if(ph) ph.textContent='Start position';
  if(scr) scr.style.width='0%';
  shotT=setInterval(()=>{if(playing)step()},1250);
}
function stopShots(){if(shotT)clearInterval(shotT);shotT=null}
</script>
<script>
/* fetch the index once, then refresh whatever is on screen */
(async function(){
  await loadIdx();
  if(!IDX) return;
  if($('s-ex').classList.contains('on') && curEx){
    openEx(curEx.di,curEx.bi,curEx.ei);
  } else if($('s-day').classList.contains('on')){
    openDay(curDay);
  }
})();
</script>
